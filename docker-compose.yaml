services:
  cups-canon:
    build: .
    container_name: cups-canon
    restart: unless-stopped
    # Host mode is mandatory for AirPrint/Avahi discovery to work
    network_mode: host
    
    # Required for the printer hardware and system communication
    devices:
      - /dev/usb:/dev/usb
    
    volumes:
      - /var/run/dbus:/var/run/dbus
      # Optional: Persist your CUPS settings even if the container is deleted
      - ./config:/etc/cups
      
    environment:
      - TZ=Asia/Tokyo  # Change to your timezone
      - USERNAME=admin
      - PASSWORD=your_secure_password

    # Healthcheck ensures the CUPS service is actually responding
    healthcheck:
      test: ["CMD", "lpstat", "-r"]
      interval: 30s
      timeout: 10s
      retries: 3
