services:
  cups-lbp3300:
    build: .
    container_name: cups-canon
    network_mode: host # Critical for AirPrint/Avahi discovery
    restart: unless-stopped
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ./config:/etc/cups
    devices:
      - /dev/usb:/dev/usb # Allows Docker to see the physical printer
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=yourpassword
