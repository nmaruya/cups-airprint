services:
  cups:
    build: .
    container_name: cups-airprint
    restart: always
    privileged: true
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus  # Use DBUS instead of the Avahi socket
      - ./cups-config:/etc/cups
#      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    environment:
      - TZ=Asia/Tokyo
